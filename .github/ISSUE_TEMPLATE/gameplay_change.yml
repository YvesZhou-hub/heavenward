name: Gameplay or balance change
description: Propose a rules, balance, content or copy change.
labels: [gameplay]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What the game does now. Name the cards, enemies or rules involved.
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
      description: Exact numbers and rounding where they matter.
      placeholder: Unspent player Armor halves, rounded down, at the start of the next turn instead of clearing.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      description: The play experience this should improve, with an example turn if possible.
  - type: checkboxes
    id: areas
    attributes:
      label: Affected areas
      options:
        - label: Combat rules or turn order (`combat.ts`, `rules.ts`)
        - label: Card, enemy or encounter numbers (`content.ts`)
        - label: Road, rewards or economy (`run.ts`)
        - label: Player-facing text in all three languages
        - label: Saves or combat replays
